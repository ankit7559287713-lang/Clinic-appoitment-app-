<!doctype html><html lang="en" data-bs-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Appointments Desk · ClinicBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/styles.css"></head><body>
<a class="skip-link" href="#main">Skip to content</a><div class="page-loader" id="pageLoader" aria-hidden="true"><div class="loader-mark">Loading…</div></div><div id="app-nav"></div><main id="main">
<section class="page-hero"><div class="container"><div class="eyebrow mb-1">Receptionist workspace</div><h1 class="mb-2">Appointments desk</h1><p class="text-muted mb-0">Manage bookings and track cancellations for every registered patient.</p></div></section>
<div class="container py-4 py-lg-5"><div class="row g-3 mb-4" id="deskStats"></div><div class="row g-4"><section class="col-lg-5"><div class="card p-3 p-lg-4"><h2 class="h5 mb-3">Book for a patient</h2><form id="deskBookingForm" novalidate>
<div class="mb-3"><label class="form-label" for="patientId">Patient</label><select class="form-select" id="patientId" required><option value="">Select patient</option></select></div>
<div class="mb-3"><label class="form-label" for="doctorId">Doctor</label><select class="form-select" id="doctorId" required><option value="">Select doctor</option></select></div>
<div class="mb-3"><label class="form-label" for="appointmentDate">Date</label><input class="form-control" type="date" id="appointmentDate" required></div>
<div class="mb-3"><label class="form-label" for="slotId">Available slot</label><select class="form-select" id="slotId" required><option value="">Select date and doctor first</option></select></div>
<div class="mb-3"><label class="form-label" for="reason">Reason for visit</label><textarea class="form-control" id="reason" rows="2" maxlength="240" required></textarea></div><div id="bookingAlert" aria-live="polite"></div><button class="btn btn-primary w-100" type="submit">Confirm appointment</button></form></div></section>
<section class="col-lg-7"><div class="card p-3 p-lg-4"><div class="d-flex flex-wrap justify-content-between gap-2 mb-3"><h2 class="h5 mb-0">All appointments</h2><input id="appointmentSearch" class="form-control" style="max-width:260px" type="search" placeholder="Search patient or doctor" aria-label="Search appointments"></div>
<div class="d-flex flex-wrap gap-2 mb-3" id="statusFilters"><button class="btn btn-sm btn-primary" data-filter="All">All</button><button class="btn btn-sm btn-soft" data-filter="Booked">Booked</button><button class="btn btn-sm btn-soft" data-filter="Cancelled">Cancelled</button><button class="btn btn-sm btn-soft" data-filter="Completed">Completed</button></div><div id="appointmentRegister" aria-live="polite"></div></div></section></div></div></main><div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script><script type="module" src="js/pages/receptionist.js"></script></body></html>
