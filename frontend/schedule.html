<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Schedule · ClinicBook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%2340e0d0'/><path d='M8 17h4l2-5 4 9 2-4h4' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-loader" id="pageLoader" aria-hidden="true"><div class="loader-mark"><span class="brand-mark"><i class="bi bi-heart-pulse-fill"></i></span>Loading…</div></div>
  <div id="app-nav"></div>
  <main id="main">
    <section class="page-hero">
      <div class="container position-relative d-flex flex-wrap align-items-center gap-3" style="z-index:1">
        <div id="docAvatar" data-animate></div>
        <div>
          <div class="eyebrow mb-1" data-animate>Doctor schedule</div>
          <h1 class="mb-1" id="docGreeting" data-animate>My schedule</h1>
          <p class="text-muted mb-0" id="docSub" data-animate></p>
        </div>
      </div>
    </section>
    <div class="container py-4 py-lg-5">
      <div class="card p-3 p-lg-4 mb-4" data-animate>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
          <h2 class="h5 mb-0"><i class="bi bi-calendar3 text-turq me-2" aria-hidden="true"></i>Day</h2>
          <div class="d-flex align-items-center gap-2">
            <label for="datePicker" class="small fw-semibold text-muted mb-0">Jump to</label>
            <input type="date" class="form-control form-control-sm" id="datePicker" style="width:auto;min-height:40px">
          </div>
        </div>
        <div class="day-strip" id="dayStrip" role="group" aria-label="Choose a day"></div>
      </div>
      <div class="row g-3 mb-4" id="dayStats"></div>
      <div class="row g-4">
        <section class="col-lg-7 col-xl-8" aria-labelledby="apptTitle">
          <div class="card p-3 p-lg-4 h-100">
            <h2 class="h5 mb-3" id="apptTitle">Appointments</h2>
            <div id="dayAppointments" aria-live="polite"></div>
          </div>
        </section>
        <aside class="col-lg-5 col-xl-4">
          <div class="card p-3 p-lg-4 mb-4">
            <h2 class="h5 mb-3"><i class="bi bi-plus-circle text-turq me-2" aria-hidden="true"></i>Add available slots</h2>
            <form id="slotForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="slotDate">Date</label>
                <input type="date" class="form-control" id="slotDate" name="date" required aria-describedby="slotDate-error">
                <div class="invalid-feedback" id="slotDate-error"></div>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="form-label" for="slotStart">Start time</label>
                  <input type="time" class="form-control" id="slotStart" name="startTime" step="300" required aria-describedby="slotStart-error">
                  <div class="invalid-feedback" id="slotStart-error"></div>
                </div>
                <div class="col-6">
                  <label class="form-label" for="slotDuration">Duration</label>
                  <select class="form-select" id="slotDuration" name="duration" aria-describedby="slotDuration-error">
                    <option value="15">15 min</option><option value="20">20 min</option><option value="30" selected>30 min</option>
                    <option value="45">45 min</option><option value="60">60 min</option>
                  </select>
                  <div class="invalid-feedback" id="slotDuration-error"></div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="slotCount">Back-to-back slots</label>
                <select class="form-select" id="slotCount" name="count" aria-describedby="slotCount-help">
                  <option value="1" selected>1 slot</option><option value="2">2 slots</option><option value="3">3 slots</option>
                  <option value="4">4 slots</option><option value="6">6 slots</option><option value="8">8 slots</option>
                </select>
                <div class="form-text" id="slotCount-help">Creates consecutive slots starting at the time above.</div>
              </div>
              <div id="slotAlert" aria-live="assertive"></div>
              <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg" aria-hidden="true"></i>Add slot</button>
            </form>
          </div>
          <div class="card p-3 p-lg-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h5 mb-0">Slots this day</h2>
              <span class="small text-muted" id="slotCountLabel"></span>
            </div>
            <ul class="list-unstyled mb-0 d-grid gap-2" id="slotList"></ul>
          </div>
        </aside>
      </div>

      <section class="card p-3 p-lg-4 mt-4" aria-labelledby="myReviewsTitle">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 class="h5 mb-0" id="myReviewsTitle"><i class="bi bi-chat-square-heart text-turq me-2" aria-hidden="true"></i>What patients say</h2>
          <span class="small text-muted"><i class="bi bi-lock me-1" aria-hidden="true"></i>Reviews can only be written by patients after a completed visit.</span>
        </div>
        <div id="myReviews"></div>
      </section>
    </div>
  </main>
  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script type="module" src="js/pages/schedule.js"></script>
</body>
</html>
