<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Appointments · ClinicBook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%2340e0d0'/><path d='M8 17h4l2-5 4 9 2-4h4' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-loader" id="pageLoader" aria-hidden="true"><div class="loader-mark"><span class="brand-mark"><i class="bi bi-heart-pulse-fill"></i></span>Loading…</div></div>
  <div id="app-nav"></div>
  <main id="main">
    <section class="page-hero">
      <div class="container position-relative d-flex flex-wrap align-items-end justify-content-between gap-3" style="z-index:1">
        <div>
          <div class="eyebrow mb-1" data-animate>My appointments</div>
          <h1 class="mb-2" id="greeting" data-animate>Your visits</h1>
          <p class="text-muted mb-0" id="nextUp" data-animate></p>
        </div>
        <a href="doctors.html" class="btn btn-primary" data-animate><i class="bi bi-calendar2-plus" aria-hidden="true"></i>Book new appointment</a>
      </div>
    </section>
    <div class="container py-4 py-lg-5">
      <div id="reviewPrompt"></div>
      <ul class="nav nav-pills gap-2 mb-4" id="apptTabs" role="tablist"></ul>
      <div id="apptList" role="tabpanel" aria-live="polite"></div>
    </div>

    <!-- Review modal -->
    <div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="reviewModalTitle"><i class="bi bi-star text-turq me-2" aria-hidden="true"></i><span id="reviewModalLabel">Rate your visit</span></h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="reviewForm" novalidate>
            <div class="modal-body">
              <div class="summary-box mb-4" id="reviewSummary"></div>
              <fieldset class="mb-3 text-center">
                <legend class="form-label fs-6 mb-2">How was your visit? <span class="text-danger" aria-hidden="true">*</span></legend>
                <div class="star-input" id="starInput" aria-describedby="rating-error">
                    <input class="visually-hidden star-radio" type="radio" name="rating" id="star1" value="1">
                    <label class="star-label" for="star1" data-star="1"><i class="bi bi-star-fill" aria-hidden="true"></i><span class="visually-hidden">1 star, Poor</span></label>
                    <input class="visually-hidden star-radio" type="radio" name="rating" id="star2" value="2">
                    <label class="star-label" for="star2" data-star="2"><i class="bi bi-star-fill" aria-hidden="true"></i><span class="visually-hidden">2 stars, Fair</span></label>
                    <input class="visually-hidden star-radio" type="radio" name="rating" id="star3" value="3">
                    <label class="star-label" for="star3" data-star="3"><i class="bi bi-star-fill" aria-hidden="true"></i><span class="visually-hidden">3 stars, Good</span></label>
                    <input class="visually-hidden star-radio" type="radio" name="rating" id="star4" value="4">
                    <label class="star-label" for="star4" data-star="4"><i class="bi bi-star-fill" aria-hidden="true"></i><span class="visually-hidden">4 stars, Very good</span></label>
                    <input class="visually-hidden star-radio" type="radio" name="rating" id="star5" value="5">
                    <label class="star-label" for="star5" data-star="5"><i class="bi bi-star-fill" aria-hidden="true"></i><span class="visually-hidden">5 stars, Excellent</span></label>
                </div>
                <div class="rating-word mt-1" id="ratingWord" aria-live="polite">Tap a star to rate</div>
                <div class="invalid-feedback d-block" id="rating-error"></div>
              </fieldset>
              <div class="mb-1">
                <label class="form-label" for="comment">Your review <span class="text-muted fw-normal">(optional)</span></label>
                <textarea class="form-control" id="comment" name="comment" rows="4" maxlength="300" aria-describedby="comment-help comment-error" placeholder="What went well? What could be better?"></textarea>
                <div class="invalid-feedback" id="comment-error"></div>
                <div class="form-text d-flex justify-content-between" id="comment-help"><span><i class="bi bi-eye me-1" aria-hidden="true"></i>Shown publicly as your first name and last initial.</span><span id="commentCount">0/300</span></div>
              </div>
              <div id="reviewAlert" class="mt-3" aria-live="assertive"></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-link text-danger me-auto px-0 d-none" id="deleteReviewBtn"><i class="bi bi-trash3" aria-hidden="true"></i>Delete review</button>
              <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary px-4" id="submitReviewBtn"><i class="bi bi-send" aria-hidden="true"></i>Post review</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script type="module" src="js/pages/appointments.js"></script>
</body>
</html>
