<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a Doctor · ClinicBook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%2340e0d0'/><path d='M8 17h4l2-5 4 9 2-4h4' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-loader" id="pageLoader" aria-hidden="true"><div class="loader-mark"><span class="brand-mark"><i class="bi bi-heart-pulse-fill"></i></span>Loading…</div></div>
  <div id="app-nav"></div>
  <main id="main">
    <section class="page-hero">
      <div class="container position-relative" style="z-index:1">
        <div class="eyebrow mb-1" data-animate>Doctor directory</div>
        <h1 class="mb-2" data-animate>Find the right doctor</h1>
        <p class="text-muted mb-0" data-animate>Search by name or specialty, then pick a time that suits you.</p>
      </div>
    </section>
    <div class="container py-4 py-lg-5">
      <div class="row g-4">
        <aside class="col-lg-4 col-xl-3" aria-label="Filters">
          <div class="card p-3 p-lg-4 filter-card" data-animate>
            <form id="filterForm" role="search" onsubmit="return false">
              <label class="form-label" for="search">Search doctors</label>
              <div class="input-icon mb-4">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input type="search" class="form-control" id="search" name="search" placeholder="Name or specialty" autocomplete="off">
              </div>
              <fieldset class="mb-4">
                <legend class="form-label fs-6">Specialty</legend>
                <div class="specialty-pills" id="specialtyPills"></div>
              </fieldset>
              <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" role="switch" id="availableToday">
                <label class="form-check-label fw-semibold" for="availableToday">Available today</label>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="hideLeave">
                <label class="form-check-label fw-semibold" for="hideLeave">Hide doctors on leave</label>
              </div>
              <label class="form-label mt-4" for="sortBy">Sort by</label>
              <select class="form-select" id="sortBy">
                <option value="name">Name (A–Z)</option>
                <option value="rating">Highest rated</option>
                <option value="soonest">Soonest available</option>
              </select>
            </form>
          </div>
        </aside>
        <section class="col-lg-8 col-xl-9" aria-labelledby="resultsTitle">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 id="resultsTitle" class="h5 mb-0">Doctors</h2>
            <p class="text-muted small mb-0" id="resultCount" aria-live="polite"></p>
          </div>
          <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="doctorGrid"></div>
        </section>
      </div>
    </div>
  </main>
  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script type="module" src="js/pages/doctors.js"></script>
</body>
</html>
